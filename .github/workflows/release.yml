name: Release

# Shared release flow, see https://github.com/boshold/gh-actions#releasing: full CI, then
# release-tag.yml writes the next version into package.json, pushes the release commit and tag and
# creates the GitHub release. The jobs below build from that tag and publish. The npm job has to
# stay in this file: the npm trusted publisher is bound to release.yml.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      dry-run:
        description: Test and build, but push, publish and release nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      full: true

  release:
    needs: ci
    uses: boshold/gh-actions/.github/workflows/release-tag.yml@main
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}

  build:
    name: Build ${{ matrix.name }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: zaps-linux-x64
          - target: bun-linux-arm64
            name: zaps-linux-arm64
          - target: bun-darwin-x64
            name: zaps-darwin-x64
          - target: bun-darwin-arm64
            name: zaps-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dry run pushes no tag, so it builds the tested commit.
          ref: ${{ inputs.dry-run && github.sha || needs.release.outputs.tag }}
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Resolve the release version
        run: echo "ZAPS_VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ needs.release.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/build-native.ts --target=${{ matrix.target }}
      - run: mv dist/zaps dist/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          retention-days: 1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: read
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dry run pushes no tag, so it builds the tested commit.
          ref: ${{ inputs.dry-run && github.sha || needs.release.outputs.tag }}
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - name: Resolve the release version
        run: echo "ZAPS_VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ needs.release.outputs.version }}
      - run: pnpm install --frozen-lockfile
      # Build before prepare-npm-platform-packages mutates package.json (which
      # would otherwise trip pnpm's lockfile check).
      - run: pnpm build
      # A no-op on the release commit, which already carries the version; a dry run builds the
      # tested commit and needs it to preview the right version.
      - name: Set package version
        run: npm version "$ZAPS_VERSION" --no-git-tag-version --allow-same-version
      - name: Prepare platform packages
        run: node_modules/.bin/tsx scripts/prepare-npm-platform-packages.ts
      # Auth via GitHub OIDC trusted publishing — NODE_AUTH_TOKEN="" so npm uses
      # OIDC instead of a token. Each package needs a Trusted Publisher on npm
      # (repo boshold/zaps, workflow release.yml). Idempotent: skip versions
      # already on the registry so a partial-failure re-run can complete.
      # A dry run only packs: `npm publish --dry-run` without provenance needs no OIDC token.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ""
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          for dir in npm-platforms/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "$name@$version already published — skipping"
            elif [ "$DRY_RUN" = "true" ]; then
              (cd "$dir" && npm publish --access public --dry-run)
            else
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ""
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@bosdev/zaps@$version" version 2>/dev/null || true)" ]; then
            echo "@bosdev/zaps@$version already published — skipping"
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi

      # Register each published package on the org's Linked Artifacts page
      # (https://github.com/orgs/boshold/artifacts) via the Artifact Metadata API.
      # Best-effort: a failure here must never break a release.
      - name: Register npm storage records
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          version=$(node -p "require('./package.json').version")
          names=$(node -p "['@bosdev/zaps', ...Object.keys(require('./package.json').optionalDependencies || {})].join('\n')")
          echo "$names" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            # Resolve the published tarball, retrying for registry propagation lag.
            tarball=""
            for i in 1 2 3 4 5; do
              tarball=$(npm view "$name@$version" dist.tarball 2>/dev/null || true)
              [ -n "$tarball" ] && break
              echo "$name@$version: tarball not on registry yet (try $i) — waiting"
              sleep 5
            done
            if [ -z "$tarball" ]; then
              echo "$name@$version: tarball unavailable — skipping"
              continue
            fi
            # Artifact Metadata API accepts only sha256 digests (algorithm:64-hex),
            # and github_repository must be the bare repo name (no owner/slash).
            digest="sha256:$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)"
            echo "registering storage record for $name@$version ($digest)"
            http=$(curl -sS -o /tmp/sr-resp.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/orgs/boshold/artifacts/metadata/storage-record \
              -d "{\"name\":\"$name\",\"version\":\"$version\",\"digest\":\"$digest\",\"registry_url\":\"https://registry.npmjs.org\",\"artifact_url\":\"https://www.npmjs.com/package/$name/v/$version\",\"github_repository\":\"$REPO_NAME\",\"status\":\"active\"}" \
              || true)
            echo "  HTTP $http"
            [ "$http" = "200" ] || { echo "  response:"; cat /tmp/sr-resp.json 2>/dev/null; echo " (non-fatal)"; }
          done

  assets:
    name: Attach binaries
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - run: chmod +x artifacts/*
      - name: Generate checksums
        run: (cd artifacts && sha256sum -- * > ../SHA256SUMS)
      # release-tag.yml already created the release with its notes.
      - name: Attach to the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" artifacts/* SHA256SUMS --clobber
