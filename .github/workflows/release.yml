name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: zaps-linux-x64
          - target: bun-linux-arm64
            name: zaps-linux-arm64
          - target: bun-darwin-x64
            name: zaps-darwin-x64
          - target: bun-darwin-arm64
            name: zaps-darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Resolve version from tag
        run: echo "ZAPS_VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/build-native.ts --target=${{ matrix.target }}
      - run: mv dist/zaps dist/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          retention-days: 1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - name: Resolve version from tag
        run: echo "ZAPS_VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - run: pnpm install --frozen-lockfile
      - name: Set package version to tag
        run: npm version "$ZAPS_VERSION" --no-git-tag-version --allow-same-version
      - name: Prepare platform packages
        run: pnpm exec tsx scripts/prepare-npm-platform-packages.ts
      - name: Publish platform packages
        run: |
          for dir in npm-platforms/*/; do
            npm publish "$dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm build
      - name: Publish main package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true
      - run: chmod +x artifacts/*
      - name: Generate checksums
        run: (cd artifacts && sha256sum * > ../SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" artifacts/* SHA256SUMS --generate-notes
