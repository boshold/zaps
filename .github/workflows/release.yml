name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: zaps-linux-x64
          - target: bun-linux-arm64
            name: zaps-linux-arm64
          - target: bun-darwin-x64
            name: zaps-darwin-x64
          - target: bun-darwin-arm64
            name: zaps-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/build-native.ts --target=${{ matrix.target }}
      - run: mv dist/zaps dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - run: chmod +x artifacts/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ inputs.tag || github.ref_name }} artifacts/* --generate-notes
